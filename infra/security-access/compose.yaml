name: syndes-security-access
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start","--http-enabled=true","--proxy-headers=xforwarded"]
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://syndes-postgres:5432/syndes_keycloak
      KC_DB_USERNAME: syndes_keycloak
      KC_DB_PASSWORD: ${PG_KEYCLOAK_PASSWORD:?}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_DB_POOL_MAX_SIZE: "10"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?}
    networks: [syndes-data,syndes-security-access,syndes-secrets]
    mem_limit: 1024m
    security_opt: [no-new-privileges:true]
    # Attach to trusted Traefik HTTPS ingress separately; no public host port.
  openfga-migrate:
    image: openfga/openfga:v1.22.1
    command: ["migrate"]
    restart: "no"
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: ${OPENFGA_DATASTORE_URI:?}
    networks: [syndes-data]
  openfga:
    image: openfga/openfga:v1.22.1
    command: ["run"]
    restart: unless-stopped
    depends_on:
      openfga-migrate: {condition: service_completed_successfully}
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: ${OPENFGA_DATASTORE_URI:?}
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${OPENFGA_PRESHARED_KEY:?}
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_LOG_FORMAT: json
    networks: [syndes-data,syndes-security-access,syndes-secrets]
    security_opt: [no-new-privileges:true]
    # REST, gRPC, playground and metrics are NOT exposed on the host.
  openbao:
    image: openbao/openbao:2.7.0
    command: ["server", "-config=/openbao/config/openbao.hcl"]
    restart: unless-stopped
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /openbao/tls/server.crt
    volumes:
      - openbao_raft:/openbao/file
      - ./openbao/config.hcl:/openbao/config/openbao.hcl:ro
      - ./openbao/tls:/openbao/tls:ro
    networks: [syndes-secrets]
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Bootstrap init/unseal is deliberately an operator action; never run -dev.
    # No published port; API restricted to the internal secrets network.
networks:
  syndes-data: {external: true}
  syndes-security-access:
    name: syndes-security-access
    driver: bridge
  syndes-secrets:
    name: syndes-secrets
    driver: bridge
    internal: true
volumes:
  openbao_raft:
