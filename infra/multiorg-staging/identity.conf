server {
  listen 8443 ssl;
  server_name identity-stage;
  ssl_certificate /etc/staging-tls/server.crt;
  ssl_certificate_key /etc/staging-tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  access_log off;
  location / {
    proxy_pass http://keycloak:8080;
    proxy_set_header Host identity-stage:8443;
    proxy_set_header X-Forwarded-Host identity-stage:8443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 8443;
  }
}
