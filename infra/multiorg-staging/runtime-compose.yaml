# Overlay on the existing isolated foundation. No production networks or ports.
services:
  keycloak:
    environment:
      KC_HOSTNAME: https://identity-stage:8443
      KC_PROXY_HEADERS: xforwarded
  identity-stage:
    image: nginx:1.28-alpine
    restart: unless-stopped
    networks: [staging_internal]
    volumes:
      - /home/delmacy/.local/share/syndes-multiorg-staging/runtime/identity.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/delmacy/.local/share/syndes-multiorg-staging/runtime/tls:/etc/staging-tls:ro
    security_opt: [no-new-privileges:true]
    labels: {syndes.environment: multi-org-staging, syndes.component: identity-stage}
  openbao-stage:
    image: openbao/openbao:2.7.0
    command: [server, -config=/openbao/config/stage.hcl]
    restart: unless-stopped
    networks: [staging_internal]
    volumes:
      - staging_openbao:/openbao/file
      - /home/delmacy/.local/share/syndes-multiorg-staging/runtime/openbao.hcl:/openbao/config/stage.hcl:ro
      - /home/delmacy/.local/share/syndes-multiorg-staging/runtime/tls:/etc/staging-tls:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    labels: {syndes.environment: multi-org-staging, syndes.component: openbao-stage}
volumes:
  staging_openbao:
    labels: {syndes.environment: multi-org-staging}
