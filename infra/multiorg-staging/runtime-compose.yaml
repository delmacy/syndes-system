# Overlay on the existing isolated foundation. No production networks or ports.
services:
  keycloak:
    environment:
      KC_HOSTNAME: https://identity-stage:8443
      KC_PROXY_HEADERS: xforwarded
  identity-stage:
    image: nginx:1.28-alpine
    restart: unless-stopped
    networks: [staging_internal]
    volumes:
      - /home/delmacy/.local/share/syndes-multiorg-staging/runtime/identity.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/delmacy/.local/share/syndes-multiorg-staging/runtime/tls:/etc/staging-tls:ro
    security_opt: [no-new-privileges:true]
    labels: {syndes.environment: multi-org-staging, syndes.component: identity-stage}
