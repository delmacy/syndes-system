name: syndes-postgres
services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PG_KEYCLOAK_PASSWORD: ${PG_KEYCLOAK_PASSWORD:?}
      PG_OPENFGA_PASSWORD: ${PG_OPENFGA_PASSWORD:?}
      PG_CORE_PASSWORD: ${PG_CORE_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bootstrap/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./bootstrap/control.schema:/opt/syndes/control.schema:ro
      - ./bootstrap/provision-tenant.sh:/opt/syndes/provision-tenant.sh:ro
    networks:
      syndes-data:
        aliases: [syndes-postgres]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    security_opt: [no-new-privileges:true]
    # Intentionally no published database port.
volumes:
  postgres_data:
networks:
  syndes-data:
    name: syndes-data
    driver: bridge
    internal: true
