name: Syndes Docs — Editorial UX

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/docs/build_starlight_continuous.py'
      - 'experiments/book-ab/starlight/**'
      - 'tests/docs-design-ux/**'
      - '.github/workflows/syndes-docs-editorial-ux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    name: Build and test editorial reading (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate complete module Markdown from canonical sources
        run: python scripts/docs/build_starlight_continuous.py

      - name: Build Starlight preview
        run: |
          npm --prefix experiments/book-ab/starlight ci --no-audit --no-fund
          npm --prefix experiments/book-ab/starlight run build
          mkdir -p .ux-preview/syndes-system/assets/experimentos/livros/b
          cp -a experiments/book-ab/starlight/dist/. .ux-preview/syndes-system/assets/experimentos/livros/b/

      - name: Prepare Playwright Chromium
        working-directory: tests/docs-design-ux
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npx playwright install --with-deps chromium

      - name: Run visual interaction tests on rendered preview
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory .ux-preview >/tmp/syndes-editorial-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          cd tests/docs-design-ux
          npx playwright test --config=playwright.config.cjs

      - name: Upload screenshots, report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syndes-editorial-ux-evidence
          path: |
            tests/docs-design-ux/playwright-report/
            tests/docs-design-ux/test-results/
          retention-days: 14
          if-no-files-found: warn
