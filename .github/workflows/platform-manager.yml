name: Syndes Platform Manager CI
on:
  push:
    paths:
      - "apps/master-admin-api/**"
      - "apps/master-admin-web/**"
      - "infra/master-admin/**"
      - "infra/postgres/compose.yaml"
      - "infra/security-access/compose.yaml"
      - "apps/core-host/compose.yaml"
      - "infra/postgres/bootstrap/control-admin.schema"
      - "apps/core-host/src/adapters.ts"
      - "apps/core-host/test/verifier-cross-client.test.mjs"
      - "tests/platform/platform-manager-postgres-smoke.sh"
      - "tests/platform/platform-manager-network-smoke.py"
      - "docs/engineering/*PLATFORM-MANAGER*"
      - ".github/workflows/platform-manager.yml"
  pull_request:
    paths:
      - "apps/master-admin-api/**"
      - "apps/master-admin-web/**"
      - "infra/master-admin/**"
      - "infra/postgres/compose.yaml"
      - "infra/security-access/compose.yaml"
      - "apps/core-host/compose.yaml"
      - "infra/postgres/bootstrap/control-admin.schema"
      - "apps/core-host/src/adapters.ts"
      - "apps/core-host/test/verifier-cross-client.test.mjs"
      - "tests/platform/platform-manager-postgres-smoke.sh"
      - "tests/platform/platform-manager-network-smoke.py"
      - "docs/engineering/*PLATFORM-MANAGER*"
      - ".github/workflows/platform-manager.yml"
permissions:
  contents: read
jobs:
  admin-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/master-admin-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/master-admin-api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: JWT cross-client, tenant denial and routes
        run: npm test

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/master-admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/master-admin-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: TypeScript and Vite production build
        run: npm run build
      - name: Frontend scope and HTTP-client regression
        run: npm test
      - name: Install browser for real compiled UI fixture checks
        run: npx playwright install --with-deps chromium
      - name: E2E login, authorized journeys, denial and logout (test-only fixtures)
        run: npm run test:browser
      - name: Preserve explicitly labeled fixture screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-manager-ui-fixtures
          path: apps/master-admin-web/test-results/*-FIXTURE.png
          if-no-files-found: ignore

  control-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate disposable role-isolation test
        run: bash -n tests/platform/platform-manager-postgres-smoke.sh
      - name: Real PostgreSQL denied writes and tenant connections
        run: bash tests/platform/platform-manager-postgres-smoke.sh

  standalone-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build independent API image
        run: docker build -f apps/master-admin-api/Dockerfile -t syndes/master-admin-api:ci .
      - name: Build independent UI image
        run: docker build -f apps/master-admin-web/Dockerfile -t syndes/master-admin-web:ci .
      - name: Validate network topology and real Docker bridge isolation (disposable)
        run: python3 tests/platform/platform-manager-network-smoke.py
      - name: Validate independent Compose structure without production secrets
        run: |
          printf 'MASTER_KEYCLOAK_ISSUER=https://id.example.test/realms/syndes\nMASTER_KEYCLOAK_AUDIENCE=syndes-master-api\nMASTER_KEYCLOAK_CLIENT_ID=syndes-master-admin\nMASTER_KEYCLOAK_JWKS_URL=https://id.example.test/realms/syndes/protocol/openid-connect/certs\nMASTER_PUBLIC_ORIGIN=https://master.example.test\nMASTER_CONTROL_DB_URL_FILE=/run/secrets/master_db_url\n' >/tmp/syndes-master-ci.env
          printf '{"issuer":"https://id.example.test/realms/syndes","clientId":"syndes-master-admin"}\n' >/tmp/syndes-master-runtime-ci.json
          touch /tmp/syndes-master-db-ci-placeholder
          MASTER_API_ENV_FILE=/tmp/syndes-master-ci.env \
          MASTER_RUNTIME_JSON=/tmp/syndes-master-runtime-ci.json \
          MASTER_DB_URL_FILE=/tmp/syndes-master-db-ci-placeholder \
            docker compose -f infra/master-admin/compose.yaml config --quiet
