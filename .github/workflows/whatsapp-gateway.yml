name: WhatsApp Gateway CI
on:
  push:
    paths:
      - 'services/whatsapp-gateway/**'
      - '.github/workflows/whatsapp-gateway.yml'
  pull_request:
    paths:
      - 'services/whatsapp-gateway/**'
      - '.github/workflows/whatsapp-gateway.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/whatsapp-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/whatsapp-gateway/go.mod
          cache-dependency-path: services/whatsapp-gateway/go.sum
      - name: Verify module
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Static analysis
        run: go vet ./...
      - name: Unit and integration tests with race detection
        run: go test -race -count=1 -cover ./...
      - name: Build
        run: go build ./cmd/gateway
      - name: Docker build
        run: docker build -t syndes-whatsapp-gateway:ci .
