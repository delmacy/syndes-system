name: Repository Integrity

on:
  push:
    branches:
      - main
      - "work/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  structure:
    name: Governance structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required structure
        shell: bash
        run: bash tests/integrity/repository-structure.sh

      - name: Verify module agent contracts
        shell: bash
        run: bash tests/integrity/module-contracts.sh
