name: Core Inbox CI
on:
  push:
    paths:
      - "modules/inbox/**"
      - "modules/whatsapp/**"
      - ".github/workflows/core-inbox.yml"
      - "packages/core-kernel/**"
  pull_request:
    paths:
      - "modules/inbox/**"
      - "modules/whatsapp/**"
      - ".github/workflows/core-inbox.yml"
      - "packages/core-kernel/**"
permissions:
  contents: read
jobs:
  inbox-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/inbox/package-lock.json
      - name: Build Core Kernel
        run: cd packages/core-kernel && npm ci --no-audit --no-fund && npm run build
      - name: Install Inbox from frozen lockfile
        run: cd modules/inbox && npm ci --no-audit --no-fund
      - name: Strict check, package build and isolation tests
        run: cd modules/inbox && npm run check && npm test && npm pack --dry-run
  inbox-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build kernel
        run: cd packages/core-kernel && npm ci --no-audit --no-fund && npm run build
      - name: Build Inbox
        run: cd modules/inbox && npm ci --no-audit --no-fund && npm run build
      - name: Build WhatsApp dependency required by Core Host
        run: cd modules/whatsapp && npm ci --no-audit --no-fund && npm run build
      - name: Build CRM plugin and install Host dependencies
        run: |
          cd modules/organizations && npm ci --no-audit --no-fund && npm run build
          cd ../core-crm && npm ci --no-audit --no-fund && npm run build
          cd ../../modules/support && npm ci --no-audit --no-fund && npm run build
          cd ../../apps/core-host && npm ci --no-audit --no-fund && npm run link-peers && npm run build
      - name: Exercise PostgreSQL isolation and mounted Inbox HTTP endpoints
        run: bash modules/inbox/test/postgres-integration.sh
