name: API

on:
  push:
    branches:
      - main
      - "work/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api:
    name: apps/api CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: api_ci
          POSTGRES_PASSWORD: api_ci_test_only
          POSTGRES_DB: control_plane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U api_ci -d control_plane"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    env:
      # Test-only credential from the disposable service above — not a repo secret.
      CONTROL_PLANE_DATABASE_URL: postgresql://api_ci:api_ci_test_only@localhost:5432/control_plane

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: npm audit
        run: npm audit

      - name: Apply Control Plane migrations
        run: npm run cp:migrations:apply

      - name: Verify Control Plane migration contract
        run: npm run cp:migrations:verify
