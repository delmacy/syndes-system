name: Syndes Core Host DevServer01 CD

on:
  workflow_run:
    workflows: ["Syndes Mainline CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: syndes-core-host-devserver01-deploy
  cancel-in-progress: false

jobs:
  tailnet-preflight:
    # Read-only unless all three independent gates match this exact main SHA:
    # release switch, SHA-specific release approval, and recovery attestation.
    if: >-
      ${{ !(vars.SYNDES_DEV_CORE_HOST_CD_ENABLED == 'true' &&
             vars.SYNDES_DEV_CORE_HOST_RELEASE_APPROVED_SHA == github.event.workflow_run.head_sha &&
             vars.SYNDES_DEV_CORE_HOST_RECOVERY_APPROVED == 'true') &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: devserver01
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Validate OIDC Client ID, Audience and Tailscale tag
        shell: bash
        env:
          OIDC_CLIENT_ID: ${{ secrets.SYNDES_TAILSCALE_OAUTH_CLIENT_ID }}
          OIDC_AUDIENCE: ${{ secrets.SYNDES_TAILSCALE_OIDC_AUDIENCE }}
          TAILSCALE_TAG: ${{ vars.SYNDES_DEV_TAILSCALE_TAG }}
        run: |
          set -Eeuo pipefail
          [[ -n "$OIDC_CLIENT_ID" && -n "$OIDC_AUDIENCE" ]]
          [[ "$TAILSCALE_TAG" == 'tag:syndes-ci' ]]
          bash -n scripts/deploy/devserver01-core-host.sh
          echo 'TAILNET_OIDC_CONFIG_PRESENT'
      - name: Verify GitHub OIDC login to Tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.SYNDES_TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.SYNDES_TAILSCALE_OIDC_AUDIENCE }}
          tags: ${{ vars.SYNDES_DEV_TAILSCALE_TAG }}
      - name: Verify runner joined Tailnet
        shell: bash
        run: |
          set -Eeuo pipefail
          tailscale status >/dev/null
          [[ -n "$(tailscale ip -4)" ]]
          echo 'TAILNET_OIDC_AUTH_VERIFIED'
      - name: Verify DevServer01 peer and noninteractive Tailscale SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.SYNDES_DEV_SSH_HOST }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_HOST" == 'delmacy-desktoppc.tayra-delta.ts.net' ]]
          tailscale ping --c=2 --until-direct=false --timeout=8s "$DEPLOY_HOST" >/dev/null
          echo 'DEVSERVER01_TAILNET_PEER_REACHABLE'
          remote_identity="$(timeout 25s tailscale ssh "delmacy@$DEPLOY_HOST" 'printf "SYNDES_USER="; id -un; printf "SYNDES_HOST="; hostname -s')"
          [[ "$remote_identity" == *'SYNDES_USER=delmacy'* && "$remote_identity" == *'SYNDES_HOST=DevServer01'* ]]
          echo 'DEVSERVER01_TAILSCALE_SSH_READONLY_PASS'
      - name: Verify locked four-file Compose contract remotely without writes
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.SYNDES_DEV_SSH_HOST }}
        run: |
          set -Eeuo pipefail
          timeout 45s tailscale ssh "delmacy@$DEPLOY_HOST" 'bash -s -- preflight' < scripts/deploy/devserver01-core-host.sh
      - name: Probe deployed Keycloak JWKS and OpenFGA health with strict anonymous denial
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.SYNDES_DEV_SSH_HOST }}
        run: |
          set -Eeuo pipefail
          bash -n scripts/ci/devserver01-core-host-auth-readonly.sh
          timeout 70s tailscale ssh "delmacy@$DEPLOY_HOST" 'bash -s' < scripts/ci/devserver01-core-host-auth-readonly.sh

  deploy:
    # Release requires all of: repository switch, approved *exact* SHA, and
    # operator-attested backup/restore. A future main push cannot auto-promote.
    if: >-
      ${{ vars.SYNDES_DEV_CORE_HOST_CD_ENABLED == 'true' &&
          vars.SYNDES_DEV_CORE_HOST_RELEASE_APPROVED_SHA == github.event.workflow_run.head_sha &&
          vars.SYNDES_DEV_CORE_HOST_RECOVERY_APPROVED == 'true' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: devserver01
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_HOST: ${{ vars.SYNDES_DEV_SSH_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Validate immutable release source, identity and script
        shell: bash
        env:
          OIDC_CLIENT_ID: ${{ secrets.SYNDES_TAILSCALE_OAUTH_CLIENT_ID }}
          OIDC_AUDIENCE: ${{ secrets.SYNDES_TAILSCALE_OIDC_AUDIENCE }}
          TAILSCALE_TAG: ${{ vars.SYNDES_DEV_TAILSCALE_TAG }}
          RELEASE_APPROVED_SHA: ${{ vars.SYNDES_DEV_CORE_HOST_RELEASE_APPROVED_SHA }}
          RECOVERY_APPROVED: ${{ vars.SYNDES_DEV_CORE_HOST_RECOVERY_APPROVED }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_APPROVED_SHA" == "$SOURCE_SHA" && "$RECOVERY_APPROVED" == 'true' ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$SOURCE_SHA" ]]
          [[ "$DEPLOY_HOST" == 'delmacy-desktoppc.tayra-delta.ts.net' ]]
          [[ "$TAILSCALE_TAG" == 'tag:syndes-ci' ]]
          [[ -n "$OIDC_CLIENT_ID" && -n "$OIDC_AUDIENCE" ]]
          bash -n scripts/deploy/devserver01-core-host.sh
      - name: Join deployment Tailnet using ephemeral GitHub OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.SYNDES_TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.SYNDES_TAILSCALE_OIDC_AUDIENCE }}
          tags: ${{ vars.SYNDES_DEV_TAILSCALE_TAG }}
          ping: ${{ vars.SYNDES_DEV_SSH_HOST }}
      - name: Verify four historical Compose manifests before building
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 45s tailscale ssh "delmacy@$DEPLOY_HOST" 'bash -s -- preflight' < scripts/deploy/devserver01-core-host.sh
      - name: Build SHA-pinned Core Host image in GitHub Actions
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$SOURCE_SHA" ]]
          docker build --file apps/core-host/Dockerfile --tag "syndes/core-host:git-$SOURCE_SHA" .
      - name: Transfer image through Tailscale SSH without SSH keys or registry
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$SOURCE_SHA" ]]
          docker save "syndes/core-host:git-$SOURCE_SHA" | gzip -1 |
            timeout 600s tailscale ssh "delmacy@$DEPLOY_HOST" 'gzip -dc | docker load'
      - name: Deploy ONLY Core Host, verify readiness and rollback on failure
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$SOURCE_SHA" ]]
          timeout 180s tailscale ssh "delmacy@$DEPLOY_HOST" "bash -s -- deploy syndes/core-host:git-$SOURCE_SHA" < scripts/deploy/devserver01-core-host.sh
