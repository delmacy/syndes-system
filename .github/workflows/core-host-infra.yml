name: Core Host and Infrastructure CI
on:
  push:
    paths:
      - "apps/core-host/**"
      - "packages/core-kernel/**"
      - "infra/**"
      - "tests/platform/**"
      - ".github/workflows/core-host-infra.yml"
  pull_request:
    paths:
      - "apps/core-host/**"
      - "infra/**"
      - "tests/platform/**"
      - ".github/workflows/core-host-infra.yml"
permissions:
  contents: read
jobs:
  core-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build reusable kernel
        run: cd packages/core-kernel && npm ci --no-audit --no-fund && npm run build
      - name: Install host dependencies
        run: cd apps/core-host && npm ci --no-audit --no-fund
      - name: Strict type checks
        run: cd apps/core-host && npm run check
      - name: Authorization and adapter regressions
        run: cd apps/core-host && npm test
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose and bash configuration
        run: |
          bash -n infra/postgres/bootstrap/00-init.sh infra/postgres/bootstrap/provision-tenant.sh tests/platform/postgres-smoke.sh
          docker compose --env-file infra/.env.ci -f infra/postgres/compose.yaml config --quiet
          docker compose --env-file infra/.env.ci -f infra/identity/compose.yaml config --quiet
          docker compose --env-file infra/.env.ci -f apps/core-host/compose.yaml config --quiet
          python3 -m json.tool infra/identity/fga-model.json >/dev/null
      - name: Start isolated PostgreSQL
        run: docker compose --env-file infra/.env.ci -f infra/postgres/compose.yaml up -d postgres
      - name: Verify service database and tenant provisioning
        run: bash tests/platform/postgres-smoke.sh
      - name: PostgreSQL logs on failure
        if: failure()
        run: docker compose --env-file infra/.env.ci -f infra/postgres/compose.yaml logs --no-color --tail 100
      - name: Remove disposable database
        if: always()
        run: docker compose --env-file infra/.env.ci -f infra/postgres/compose.yaml down -v --remove-orphans
