name: Core Framework CI
on:
  push:
    paths:
      - 'packages/core-kernel/**'
      - '.github/workflows/core-kernel.yml'
      - 'docs/engineering/CORE-FRAMEWORK-ARCHITECTURE.md'
  pull_request:
    paths:
      - 'packages/core-kernel/**'
      - '.github/workflows/core-kernel.yml'
      - 'docs/engineering/CORE-FRAMEWORK-ARCHITECTURE.md'
permissions:
  contents: read
jobs:
  test-and-pack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core-kernel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bootstrap dependency lock for initial release
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install from generated lockfile
        run: npm ci --no-audit --no-fund
      - name: Strict typecheck
        run: npm run check
      - name: Build and regression tests
        run: npm test
      - name: Inspect publishable contents
        run: npm pack --dry-run
      - name: Initial lockfile capture
        run: |
          echo SYNDES_CORE_LOCKFILE_BEGIN
          base64 -w0 package-lock.json
          echo
          echo SYNDES_CORE_LOCKFILE_END
