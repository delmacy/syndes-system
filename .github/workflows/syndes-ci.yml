name: Syndes Mainline CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syndes-mainline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  foundation:
    name: Repository governance and planner regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify required repository structure
        run: |
          set -euo pipefail
          bash tests/integrity/repository-structure.sh
          count=0
          for file in modules/*/AGENTS.md; do
            test -s "$file"
            count=$((count + 1))
          done
          if [ "$count" -lt 11 ]; then
            echo "::error::Expected at least 11 module AGENTS.md contracts; found $count"
            exit 1
          fi
      - name: Prove fail-closed test selection and removed-workflow parity
        run: node --test scripts/ci/*.test.mjs
      - name: Verify CI executor shell syntax
        run: bash -n scripts/ci/*.sh
      - name: Preserve the physical single-organization guard
        run: |
          set -euo pipefail
          test -f modules/organizations/sql/002_legacy_single_context_gate.sql
          grep -q platform_legacy_single_organization modules/organizations/sql/002_legacy_single_context_gate.sql
          grep -q platform_legacy_single_workspace modules/organizations/sql/002_legacy_single_context_gate.sql
          test -f modules/organizations/sql/manual/activate_multiple_organizations.sql
          echo 'Physical SQL 002 safety lock is still present'

  impact:
    name: Determine regression impact
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.planner.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: planner
        name: Compare PR source against merge base and select suites
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only --diff-filter=ACMRT "$PR_BASE" "$PR_HEAD" > "$RUNNER_TEMP/syndes-changed-files.txt"
            node scripts/ci/plan.mjs impact "$RUNNER_TEMP/syndes-changed-files.txt" > "$RUNNER_TEMP/syndes-matrix.json"
          else
            # On main, scheduled merge groups or manual dispatch, test everything installed.
            node scripts/ci/plan.mjs full > "$RUNNER_TEMP/syndes-matrix.json"
          fi
          cat "$RUNNER_TEMP/syndes-matrix.json"
          echo "matrix=$(cat "$RUNNER_TEMP/syndes-matrix.json")" >> "$GITHUB_OUTPUT"

  regression:
    name: Regression / ${{ matrix.suite }}
    needs: [foundation, impact]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.impact.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ matrix.node != 'go' }}
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-go@v5
        if: ${{ matrix.node == 'go' }}
        with:
          go-version-file: modules/whatsapp/gateway/whatsmeow/go.mod
          cache-dependency-path: modules/whatsapp/gateway/whatsmeow/go.sum
      - name: Execute selected immutable regression suite
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run: bash scripts/ci/run-suite.sh "$SUITE"

  support-browser-parity:
    name: Support browser / real identity and database parity
    needs: [foundation, impact]
    if: ${{ contains(needs.impact.outputs.matrix, '"suite":"support"') || contains(needs.impact.outputs.matrix, '"suite":"support-web"') }}
    uses: ./.github/workflows/support-browser-e2e.yml

  platform-manager-parity:
    name: Platform Manager / real identity and SQL parity
    needs: [foundation, impact]
    if: ${{ contains(needs.impact.outputs.matrix, '"suite":"platform-api"') || contains(needs.impact.outputs.matrix, '"suite":"platform-web"') || contains(needs.impact.outputs.matrix, '"suite":"infra"') }}
    uses: ./.github/workflows/platform-manager.yml

  gate:
    name: Syndes CI Gate
    if: ${{ always() }}
    needs: [foundation, impact, regression, support-browser-parity, platform-manager-parity]
    runs-on: ubuntu-latest
    steps:
      - name: Deny merge unless all required checks actually passed
        shell: bash
        env:
          FOUNDATION: ${{ needs.foundation.result }}
          IMPACT: ${{ needs.impact.result }}
          REGRESSION: ${{ needs.regression.result }}
          SUPPORT_BROWSER: ${{ needs.support-browser-parity.result }}
          PLATFORM_MANAGER: ${{ needs.platform-manager-parity.result }}
          SUPPORT_REQUIRED: ${{ contains(needs.impact.outputs.matrix, '"suite":"support"') || contains(needs.impact.outputs.matrix, '"suite":"support-web"') }}
          PLATFORM_REQUIRED: ${{ contains(needs.impact.outputs.matrix, '"suite":"platform-api"') || contains(needs.impact.outputs.matrix, '"suite":"platform-web"') || contains(needs.impact.outputs.matrix, '"suite":"infra"') }}
        run: |
          set -euo pipefail
          for result in "$FOUNDATION" "$IMPACT" "$REGRESSION"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required mainline CI job failed, was cancelled, or was skipped ($result)"
              exit 1
            fi
          done
          check_selected_parity() {
            local label="$1" required="$2" actual="$3"
            if [[ "$required" == "true" && "$actual" != "success" ]]; then
              echo "::error::Required $label check failed, was cancelled or skipped ($actual)"
              exit 1
            fi
            if [[ "$required" == "false" && "$actual" != "skipped" ]]; then
              echo "::error::Unexpected $label check result ($actual) for unimpacted scope"
              exit 1
            fi
          }
          check_selected_parity "Support Browser" "$SUPPORT_REQUIRED" "$SUPPORT_BROWSER"
          check_selected_parity "Platform Manager" "$PLATFORM_REQUIRED" "$PLATFORM_MANAGER"
          echo "Syndes CI Gate: PASS (all selected domains + real identity parity)"

  staging-readonly:
    name: Multi-org staging read-only evidence — manual only
    if: ${{ github.event_name == 'workflow_dispatch' && vars.SYNDES_MULTIORG_STAGING_PREFLIGHT_ENABLED == 'true' }}
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: multi-org-staging
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_SHA: ${{ github.sha }}
      APPROVED_SHA: ${{ vars.SYNDES_MULTIORG_STAGING_PREFLIGHT_SHA }}
      STAGING_PEER: ${{ vars.SYNDES_MULTIORG_STAGING_HOST }}
      STAGING_USER: ${{ vars.SYNDES_MULTIORG_STAGING_SSH_USER }}
      TAILSCALE_TAG: ${{ vars.SYNDES_DEV_TAILSCALE_TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact main SHA and distinct staging Tailnet peer
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${APPROVED_SHA}" == "${SOURCE_SHA}" ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${SOURCE_SHA}" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "${SOURCE_SHA}" ]]
          [[ "${STAGING_PEER}" =~ ^[a-z0-9-]+\.tayra-delta\.ts\.net$ ]]
          [[ "${STAGING_PEER}" != 'delmacy-desktoppc.tayra-delta.ts.net' ]]
          [[ "${STAGING_USER}" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [[ "${TAILSCALE_TAG}" == "tag:syndes-ci" ]]
          bash -n scripts/ci/multiorg-staging-readonly.sh
          echo 'MO_REL04_STAGING_SHA_AND_TARGET_VERIFIED'
      - name: Join dedicated staging Tailnet using GitHub OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.SYNDES_TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.SYNDES_TAILSCALE_OIDC_AUDIENCE }}
          tags: ${{ vars.SYNDES_DEV_TAILSCALE_TAG }}
      - name: Inspect staging components read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          tailscale ping --c=2 --until-direct=false --timeout=8s "${STAGING_PEER}" >/dev/null
          timeout 70s tailscale ssh "${STAGING_USER}@${STAGING_PEER}" \
            'SYNDES_STAGING_REMOTE_MODE=read-only-v1 bash -s -- preflight' \
            < scripts/ci/multiorg-staging-readonly.sh

  devserver01-multiorg-staging-readonly:
    name: MO-REL-04 DevServer01 staging inventory — read-only
    # Explicit user authorization permits staging on the existing DevServer01.
    # On a successful main push, inspect ONLY staging-labeled Docker metadata.
    # Do not deploy, create containers, run SQL or change the runtime.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SYNDES_MULTIORG_STAGING_FULL_INVENTORY_ENABLED == 'true' }}
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: devserver01
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_SHA: ${{ github.sha }}
      DEVSERVER_PEER: ${{ vars.SYNDES_DEV_SSH_HOST }}
      TAILSCALE_TAG: ${{ vars.SYNDES_DEV_TAILSCALE_TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm exact approved DevServer01 peer and immutable main SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${SOURCE_SHA}" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "${SOURCE_SHA}" ]]
          [[ "${DEVSERVER_PEER}" == 'delmacy-desktoppc.tayra-delta.ts.net' ]]
          [[ "${TAILSCALE_TAG}" == 'tag:syndes-ci' ]]
          bash -n scripts/ci/multiorg-staging-readonly.sh
          echo 'MO_REL04_DEVSERVER_READONLY_SCOPE_VERIFIED'
      - name: Connect to authorized DevServer01 Tailnet via GitHub OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.SYNDES_TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.SYNDES_TAILSCALE_OIDC_AUDIENCE }}
          tags: ${{ vars.SYNDES_DEV_TAILSCALE_TAG }}
      - name: Confirm authorized DevServer01 SSH host identity
        shell: bash
        run: |
          set -Eeuo pipefail
          tailscale ping --c=2 --until-direct=false --timeout=8s "${DEVSERVER_PEER}" >/dev/null
          identity="$(timeout 25s tailscale ssh "delmacy@${DEVSERVER_PEER}" 'printf "SYNDES_USER="; id -un; printf "SYNDES_HOST="; hostname -s')"
          [[ "${identity}" == *'SYNDES_USER=delmacy'* && "${identity}" == *'SYNDES_HOST=DevServer01'* ]]
          echo 'MO_REL04_DEVSERVER01_IDENTITY_PASS'
      - name: Inspect only multi-org-staging labeled Docker services
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 75s tailscale ssh "delmacy@${DEVSERVER_PEER}" \
            'SYNDES_STAGING_REMOTE_MODE=read-only-v1 bash -s -- preflight' \
            < scripts/ci/multiorg-staging-readonly.sh

  devserver01-multiorg-stage-foundation:
    name: MO-REL-04 DevServer01 isolated staging foundation — one-shot CD
    # Explicit user-authorized DevServer01 staging preparation.
    # One-shot reviewed PR marker; NEVER a general main/branch deploy.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, 'MO-REL04-DEVSERVER-STAGE-INFRA-APPROVED') }}
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: devserver01
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_SHA: ${{ github.sha }}
      DEPLOY_HOST: ${{ vars.SYNDES_DEV_SSH_HOST }}
      TAILSCALE_TAG: ${{ vars.SYNDES_DEV_TAILSCALE_TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify one-shot main merge SHA and staging-only contract
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${SOURCE_SHA}" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "${SOURCE_SHA}" ]]
          [[ "${DEPLOY_HOST}" == 'delmacy-desktoppc.tayra-delta.ts.net' ]]
          [[ "${TAILSCALE_TAG}" == 'tag:syndes-ci' ]]
          bash -n scripts/deploy/devserver01-multiorg-staging-infra.sh
          bash -n scripts/ci/multiorg-staging-readonly.sh
          bash -n infra/multiorg-staging/init-staging-postgres.sh
          echo 'MO_REL04_STAGE_FOUNDATION_CI_CONTRACT_PASS'
      - name: Join already-authorized DevServer01 Tailnet using GitHub OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.SYNDES_TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.SYNDES_TAILSCALE_OIDC_AUDIENCE }}
          tags: ${{ vars.SYNDES_DEV_TAILSCALE_TAG }}
      - name: Verify DevServer01 identity and safe staging capacity
        shell: bash
        run: |
          set -Eeuo pipefail
          tailscale ping --c=2 --until-direct=false --timeout=8s "${DEPLOY_HOST}" >/dev/null
          identity="$(timeout 25s tailscale ssh "delmacy@${DEPLOY_HOST}" 'printf "SYNDES_USER="; id -un; printf "SYNDES_HOST="; hostname -s')"
          [[ "${identity}" == *'SYNDES_USER=delmacy'* && "${identity}" == *'SYNDES_HOST=DevServer01'* ]]
          timeout 70s tailscale ssh "delmacy@${DEPLOY_HOST}" \
            'bash -s -- preflight' < scripts/deploy/devserver01-multiorg-staging-infra.sh
      - name: Transfer only reviewed staging files to a dedicated private directory
        shell: bash
        run: |
          set -Eeuo pipefail
          root='/home/delmacy/.local/share/syndes-multiorg-staging'
          # The remote preflight already rejected symlink roots and collisions.
          tar -C infra/multiorg-staging -cf - compose.yaml init-staging-postgres.sh |
            timeout 90s tailscale ssh "delmacy@${DEPLOY_HOST}" \
              "install -d -m 0700 '$root' && tar -C '$root' --no-same-owner -xf -"
      - name: Install isolated PG17, Keycloak and OpenFGA — never product Core
        shell: bash
        run: |
          set -Eeuo pipefail
          compose_sha="$(sha256sum infra/multiorg-staging/compose.yaml | awk '{print $1}')"
          init_sha="$(sha256sum infra/multiorg-staging/init-staging-postgres.sh | awk '{print $1}')"
          timeout 900s tailscale ssh "delmacy@${DEPLOY_HOST}" \
            "SYNDES_STAGE_INFRA_APPLY=MO_REL04_CI_APPROVED SYNDES_STAGE_COMPOSE_SHA256=$compose_sha SYNDES_STAGE_INIT_SHA256=$init_sha bash -s -- apply" \
            < scripts/deploy/devserver01-multiorg-staging-infra.sh
      - name: Read-only verify all 3 staged components; Core Gate remains closed
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 75s tailscale ssh "delmacy@${DEPLOY_HOST}" \
            'SYNDES_STAGING_REMOTE_MODE=read-only-v1 bash -s -- foundation' \
            < scripts/ci/multiorg-staging-readonly.sh
          echo 'MO_REL04_FOUNDATION_INSTALLED_NO_CORE_NO_CUTOVER'

  devserver01-multiorg-stage-evidence:
    name: MO-REL-04 staging evidence — issue 208 / read-only
    # One-shot AFTER successful mainline CI. Never expose Docker env/secrets,
    # tenant IDs, host addresses or Keycloak/OpenFGA tokens in the issue.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, 'MO-REL04-DEVSERVER-STAGE-VERIFY-APPROVED') }}
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: devserver01
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      SOURCE_SHA: ${{ github.sha }}
      DEVSERVER_PEER: ${{ vars.SYNDES_DEV_SSH_HOST }}
      TAILSCALE_TAG: ${{ vars.SYNDES_DEV_TAILSCALE_TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify SHA and allowlisted DevServer01 identity
        id: scope
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${SOURCE_SHA}" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "${SOURCE_SHA}" ]]
          [[ "${DEVSERVER_PEER}" == 'delmacy-desktoppc.tayra-delta.ts.net' ]]
          [[ "${TAILSCALE_TAG}" == 'tag:syndes-ci' ]]
          bash -n scripts/ci/multiorg-staging-readonly.sh
      - name: Join existing DevServer01 Tailnet with GitHub OIDC
        id: tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.SYNDES_TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.SYNDES_TAILSCALE_OIDC_AUDIENCE }}
          tags: ${{ vars.SYNDES_DEV_TAILSCALE_TAG }}
      - name: Verify DevServer01 remote Linux identity
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          tailscale ping --c=2 --until-direct=false --timeout=8s "${DEVSERVER_PEER}" >/dev/null
          identity="$(timeout 25s tailscale ssh "delmacy@${DEVSERVER_PEER}" 'printf "SYNDES_USER="; id -un; printf "SYNDES_HOST="; hostname -s')"
          [[ "${identity}" == *'SYNDES_USER=delmacy'* && "${identity}" == *'SYNDES_HOST=DevServer01'* ]]
      - name: Inspect three staged foundation services only
        id: foundation
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 75s tailscale ssh "delmacy@${DEVSERVER_PEER}" \
            'SYNDES_STAGING_REMOTE_MODE=read-only-v1 bash -s -- foundation' \
            < scripts/ci/multiorg-staging-readonly.sh
      - name: Observe full four-service topology; do not mark product READY
        id: full_inventory
        if: ${{ steps.foundation.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 75s tailscale ssh "delmacy@${DEVSERVER_PEER}" \
            'SYNDES_STAGING_REMOTE_MODE=read-only-v1 bash -s -- preflight' \
            < scripts/ci/multiorg-staging-readonly.sh
      - name: Publish sanitized staging evidence to MO-REL-04 issue
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE_RESULT: ${{ steps.scope.outcome }}
          TAILNET_RESULT: ${{ steps.tailnet.outcome }}
          IDENTITY_RESULT: ${{ steps.identity.outcome }}
          FOUNDATION_RESULT: ${{ steps.foundation.outcome }}
          FULL_RESULT: ${{ steps.full_inventory.outcome }}
        run: |
          set -Eeuo pipefail
          # GitHub step outcomes are fixed enums; validate before publishing.
          for value in "$SCOPE_RESULT" "$TAILNET_RESULT" "$IDENTITY_RESULT" "$FOUNDATION_RESULT" "$FULL_RESULT"; do
            [[ "$value" =~ ^(success|failure|skipped|cancelled)$ ]] || exit 2
          done
          if [[ "$FOUNDATION_RESULT" == success ]]; then
            stage='FOUNDATION_VERIFIED'
          else
            stage='FOUNDATION_BLOCKED'
          fi
          if [[ "$FULL_RESULT" == success ]]; then
            full='FOUR_COMPONENT_INVENTORY_PASS_NOT_PRODUCT_GATE'
          else
            full='FOUR_COMPONENT_INVENTORY_BLOCKED'
          fi
          body="$(printf 'MO-REL-04 DevServer01 staging read-only attestation. Source main SHA: %s. Actions run: https://github.com/%s/actions/runs/%s. Scope=%s; Tailnet=%s; Host identity=%s; PG17+Keycloak+OpenFGA=%s; Core topology=%s. Stage=%s; Full=%s. No SQL, grants, deployment, migration, secrets, principal identifiers or cutover performed by this verification job. PRODUCTION_GATE=BLOCKED.\n' \
            "$SOURCE_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "$SCOPE_RESULT" "$TAILNET_RESULT" "$IDENTITY_RESULT" \
            "$FOUNDATION_RESULT" "$FULL_RESULT" "$stage" "$full")"
          gh issue comment 208 --repo "$GITHUB_REPOSITORY" --body "$body"

  devserver01-multiorg-real-services-smoke:
    name: MO-REL-04 actual PG Keycloak FGA smoke — stage only
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, 'MO-REL04-REAL-STAGING-SMOKE-APPROVED') }}
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: devserver01
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      SOURCE_SHA: ${{ github.sha }}
      DEVSERVER_PEER: ${{ vars.SYNDES_DEV_SSH_HOST }}
      TAILSCALE_TAG: ${{ vars.SYNDES_DEV_TAILSCALE_TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact main SHA and staging-only smoke
        id: scope
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${SOURCE_SHA}" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "${SOURCE_SHA}" ]]
          [[ "${DEVSERVER_PEER}" == 'delmacy-desktoppc.tayra-delta.ts.net' ]]
          [[ "${TAILSCALE_TAG}" == 'tag:syndes-ci' ]]
          bash -n scripts/ci/multiorg-staging-services-smoke.sh
      - name: Join existing stage Tailnet through GitHub OIDC
        id: tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.SYNDES_TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.SYNDES_TAILSCALE_OIDC_AUDIENCE }}
          tags: ${{ vars.SYNDES_DEV_TAILSCALE_TAG }}
      - name: Verify actual staging PostgreSQL and Keycloak/OpenFGA HTTP
        id: service_smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          tailscale ping --c=2 --until-direct=false --timeout=8s "${DEVSERVER_PEER}" >/dev/null
          timeout 75s tailscale ssh "delmacy@${DEVSERVER_PEER}" \
            'SYNDES_STAGING_REMOTE_MODE=read-only-v1 bash -s -- verify' \
            < scripts/ci/multiorg-staging-services-smoke.sh
      - name: Record safe live service evidence in MO-REL-04 issue
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE_RESULT: ${{ steps.scope.outcome }}
          TAILNET_RESULT: ${{ steps.tailnet.outcome }}
          SMOKE_RESULT: ${{ steps.service_smoke.outcome }}
        run: |
          set -Eeuo pipefail
          for outcome in "$SCOPE_RESULT" "$TAILNET_RESULT" "$SMOKE_RESULT"; do
            [[ "$outcome" =~ ^(success|failure|skipped|cancelled)$ ]] || exit 2
          done
          if [[ "$SMOKE_RESULT" == success ]]; then
            status='REAL_STAGE_PG_KC_FGA_SERVICE_SMOKE_PASS_NOT_CORE_E2E'
          else
            status='REAL_STAGE_SERVICE_SMOKE_BLOCKED'
          fi
          body="$(printf 'MO-REL-04 actual DevServer01 staging service smoke. Main SHA=%s. Run=https://github.com/%s/actions/runs/%s. Scope=%s; Tailnet=%s; Real PG17 Keycloak OIDC OpenFGA HTTP=%s; result=%s. Read-only synthetic staging probe; no Core Host, no signup E2E, no SQL002 cutover, no data/grants/secrets exposed. PRODUCTION_GATE=BLOCKED.' \
            "$SOURCE_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "$SCOPE_RESULT" "$TAILNET_RESULT" "$SMOKE_RESULT" "$status")"
          gh issue comment 208 --repo "$GITHUB_REPOSITORY" --body "$body"

  devserver01-multiorg-control-db-repair:
    name: MO-REL-04 stage Control DB catalog repair and live service verification
