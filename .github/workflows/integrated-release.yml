name: Syndes Integrated Release Candidate Gate
# A single green/rejected gate for the complete stack before any main merge.
# Development branches keep their existing targeted CI, but production promotion
# uses the explicit fan-out/fan-in, never one isolated feature branch check.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: syndes-main-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lineage-and-physical-lock:
    name: Verify dependency ancestry and unchanged SQL 002
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release candidate must include functional feature lineage
        shell: bash
        run: |
          set -euo pipefail
          for ancestor in \
            8e2fb5d1f0e0bc110d2ff82e36303b734ee6f1f9 \
            0d66f19e7d49e17693cf6b77e7c25a2c15ccf037 \
            1b8c09729615a9860e3abcd6f54b1eb44cd1cfff; do
            git merge-base --is-ancestor "$ancestor" HEAD || {
              echo "Release candidate is missing reviewed feature ancestry $ancestor" >&2
              exit 1
            }
          done
          git diff --exit-code \
            8e2fb5d1f0e0bc110d2ff82e36303b734ee6f1f9 HEAD \
            -- modules/organizations/sql/002_legacy_single_context_gate.sql \
               modules/organizations/sql/manual/activate_multiple_organizations.sql
          grep -q 'platform_legacy_single_organization' \
            modules/organizations/sql/002_legacy_single_context_gate.sql
          grep -q 'platform_legacy_single_workspace' \
            modules/organizations/sql/002_legacy_single_context_gate.sql
          echo 'Full-stack lineage and physical multi-org safety gates: PASS'
  host-and-infra:
    needs: lineage-and-physical-lock
    uses: ./.github/workflows/core-host-infra.yml
  crm:
    needs: lineage-and-physical-lock
    uses: ./.github/workflows/core-crm.yml
  inbox:
    needs: lineage-and-physical-lock
    uses: ./.github/workflows/core-inbox.yml
  whatsapp:
    needs: lineage-and-physical-lock
    uses: ./.github/workflows/whatsapp-mvp.yml
  workspace:
    needs: lineage-and-physical-lock
    uses: ./.github/workflows/workspace-web.yml
  platform-manager:
    needs: lineage-and-physical-lock
    uses: ./.github/workflows/platform-manager.yml
  support:
    needs: lineage-and-physical-lock
    uses: ./.github/workflows/core-support.yml
  support-e2e:
    needs: lineage-and-physical-lock
    uses: ./.github/workflows/support-browser-e2e.yml
  final-release-decision:
    name: All-domain gate (not deployment approval)
    if: always()
    needs:
      - lineage-and-physical-lock
      - host-and-infra
      - crm
      - inbox
      - whatsapp
      - workspace
      - platform-manager
      - support
      - support-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Reject every failure, cancellation or skip in required jobs
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_RESULTS" | jq -r 'to_entries[] | [.key,.value.result] | @tsv'
          printf '%s\n' "$NEEDS_RESULTS" | jq -e \
            'all(.[]; .result == "success")' >/dev/null || {
              echo 'BLOCKED: some release-candidate domain checks did not succeed' >&2
              exit 1
            }
          echo 'INTEGRATED_CI_PASS: this is NOT a go-live authorization.'
