name: Core CRM CI
on:
  workflow_call:
  push:
    paths:
      - "modules/core-crm/**"
      - "packages/core-kernel/**"
      - ".github/workflows/core-crm.yml"
  pull_request:
    paths:
      - "modules/core-crm/**"
      - "packages/core-kernel/**"
      - ".github/workflows/core-crm.yml"
permissions:
  contents: read
jobs:
  crm-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/core-crm/package-lock.json
      - name: Build Core Kernel
        run: cd packages/core-kernel && npm ci --no-audit --no-fund && npm run build
      - name: Install CRM dependencies
        run: cd modules/core-crm && npm ci --no-audit --no-fund
      - name: Typecheck and domain isolation tests
        run: cd modules/core-crm && npm run check && npm test
  crm-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Core Kernel
        run: cd packages/core-kernel && npm ci --no-audit --no-fund && npm run build
      - name: Build independent CRM package
        run: cd modules/core-crm && npm ci --no-audit --no-fund && npm run build
      - name: Install pg client from frozen Core Host lockfile
        run: cd apps/core-host && npm ci --no-audit --no-fund
      - name: Apply migrations twice and exercise cross-tenant SQL isolation
        run: bash modules/core-crm/test/postgres-integration.sh
