name: WhatsApp Core Receiver CI
on:
  pull_request:
    paths:
      - 'modules/whatsapp/src/**'
      - 'modules/whatsapp/sql/**'
      - 'modules/whatsapp/test/**'
      - 'modules/whatsapp/package.json'
      - 'apps/core-host/**'
      - 'apps/workspace-web/**'
      - 'apps/core-host/**'
      - 'apps/workspace-web/**'
      - '.github/workflows/whatsapp-core.yml'
  push:
    branches: ['feat/whatsapp-module-foundation']
    paths:
      - 'modules/whatsapp/src/**'
      - 'modules/whatsapp/sql/**'
      - 'modules/whatsapp/test/**'
      - 'modules/whatsapp/package.json'
      - '.github/workflows/whatsapp-core.yml'
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build shared Core Kernel
        run: cd packages/core-kernel && npm ci --no-audit --no-fund && npm run build
      - name: Install WhatsApp module dependencies
        run: cd modules/whatsapp && npm install --no-package-lock --no-audit --no-fund
      - name: TypeScript build and isolation tests
        run: cd modules/whatsapp && npm run check && npm test

  core-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build shared domain modules
        run: |
          cd packages/core-kernel && npm ci --no-audit --no-fund && npm run build
          cd ../../modules/organizations && npm ci --no-audit --no-fund && npm run build
          cd ../core-crm && npm ci --no-audit --no-fund && npm run build
          cd ../inbox && npm ci --no-audit --no-fund && npm run build
          cd ../whatsapp && npm install --no-package-lock --no-audit --no-fund && npm run build
          cd ../support && npm ci --no-audit --no-fund && npm run build
      - name: Validate plugin installation and Core Host tests
        run: |
          cd apps/core-host
          npm ci --no-audit --no-fund
          npm run link-peers
          npm test
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build QR Code and Inbox workspace
        run: |
          cd apps/workspace-web
          npm ci --no-audit --no-fund
          npm run build
