name: WhatsApp Gateway Go

on:
  pull_request:
    paths:
      - 'modules/whatsapp/gateway/whatsmeow/**'
      - '.github/workflows/whatsapp-go.yml'
  push:
    branches:
      - 'feat/whatsapp-module-foundation'
    paths:
      - 'modules/whatsapp/gateway/whatsmeow/**'
      - '.github/workflows/whatsapp-go.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whatsapp-go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go build, vet and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: modules/whatsapp/gateway/whatsmeow
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: modules/whatsapp/gateway/whatsmeow/go.mod
          cache-dependency-path: modules/whatsapp/gateway/whatsmeow/go.sum
      - name: Format Go sources on the approved feature branch
        if: (github.event_name == 'push' && github.ref == 'refs/heads/feat/whatsapp-module-foundation') || (github.event_name == 'pull_request' && github.head_ref == 'feat/whatsapp-module-foundation' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          gofmt -w $(find . -name '*.go' -type f)
          if ! git diff --quiet -- '*.go'; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- '*.go'
            git commit -m 'style(whatsapp-go): apply gofmt'
            git push origin HEAD:feat/whatsapp-module-foundation
          fi
      - name: Validate formatting
        run: |
          files="$(gofmt -l $(find . -name '*.go' -type f))"
          if [ -n "$files" ]; then
            printf 'Files needing gofmt:\n%s\n' "$files"
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
