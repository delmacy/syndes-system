name: Syndes Docs — GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "catalog/work-units.json"
      - "catalog/evolution-associations.json"
      - "catalog/traceability-links.json"
      - "scripts/docs/**"
      - ".github/workflows/syndes-docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: syndes-docs-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish documentation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

        with:
          fetch-depth: 0 # Required for accurate Git blame timestamps per topic

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/docs/requirements.txt

      - name: Install static documentation dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/docs/requirements.txt

      - name: Validate the repository ownership index
        run: bash tests/integrity/repository-structure.sh

      - name: Validate topic-level editor parser
        run: python -m unittest discover -s scripts/docs -p "test_*.py" -v

      - name: Setup Node for contextual editor tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify contextual prompt generation
        run: node --test scripts/docs/test_editor.mjs

      - name: Prepare selected documentation
        run: python scripts/docs/build_site.py

      - name: Build the static website
        run: mkdocs build --config-file .docs-site/mkdocs.yml --clean

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .docs-site/site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
