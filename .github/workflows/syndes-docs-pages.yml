name: Syndes Docs — GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "catalog/work-units.json"
      - "catalog/evolution-associations.json"
      - "catalog/traceability-links.json"
      - "scripts/docs/**"
      - "experiments/book-ab/starlight/**"
      - "apps/docs-reader/**"
      - "tests/docs-design-ux/**"
      - "modules/**"
      - "apps/**"
      - "packages/**"
      - "infra/**"
      - ".github/workflows/syndes-docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: syndes-docs-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish documentation
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

        with:
          fetch-depth: 0 # Required for accurate Git blame timestamps per topic

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/docs/requirements.txt

      - name: Install static documentation dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/docs/requirements.txt

      - name: Validate the repository ownership index
        run: bash tests/integrity/repository-structure.sh

      - name: Setup Node for contextual editor tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compose the Starlight book from canonical Markdown
        run: |
          python scripts/docs/build_starlight_continuous.py
          npm --prefix experiments/book-ab/starlight ci --no-audit --no-fund
          npm --prefix experiments/book-ab/starlight run build
          rm -rf docs/assets/experimentos/livros/b
          mkdir -p docs/assets/experimentos/livros/b
          cp -a experiments/book-ab/starlight/dist/. docs/assets/experimentos/livros/b/

      - name: Validate Starlight editorial reading with Playwright Chromium
        run: |
          npm --prefix tests/docs-design-ux install --no-audit --no-fund --no-package-lock
          (cd tests/docs-design-ux && npx playwright install --with-deps chromium)
          mkdir -p .ux-preview/syndes-system/assets/experimentos/livros/b
          cp -a experiments/book-ab/starlight/dist/. .ux-preview/syndes-system/assets/experimentos/livros/b/
          python -m http.server 8765 --bind 127.0.0.1 --directory .ux-preview >/tmp/syndes-docs-ux.log 2>&1 &
          docs_server_pid=$!
          trap 'kill "$docs_server_pid" || true' EXIT
          sleep 2
          (cd tests/docs-design-ux && npx playwright test --config=playwright.config.cjs)

      - name: Upload documentation UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syndes-docs-ux-evidence
          path: |
            tests/docs-design-ux/playwright-report/
            tests/docs-design-ux/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Validate topic-level editor and continuous book
        run: python -m unittest discover -s scripts/docs -p "test_*.py" -v

      - name: Verify contextual prompt generation
        run: node --test scripts/docs/test_editor.mjs scripts/docs/test_layered_portal.mjs scripts/docs/test_projects_dashboard.mjs

      - name: Export Next.js and Chakra docs reader to isolated Pages path
        env:
          NEXT_PUBLIC_READER_BASEPATH: /syndes-system/assets/docs-reader
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm --prefix apps/docs-reader install --no-audit --no-fund
          npm --prefix apps/docs-reader test
          npm --prefix apps/docs-reader run build
          rm -rf docs/assets/docs-reader
          mkdir -p docs/assets/docs-reader
          cp -a apps/docs-reader/out/. docs/assets/docs-reader/
          test -s docs/assets/docs-reader/index.html
          test -s docs/assets/docs-reader/modulos/crm/index.html

      - name: Prepare selected documentation
        run: python scripts/docs/build_site.py

      - name: Build the static website
        run: mkdocs build --config-file .docs-site/mkdocs.yml --clean

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .docs-site/site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
