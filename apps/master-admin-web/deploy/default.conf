server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1k;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cache-Control "no-store, private" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; form-action 'none'; base-uri 'self'; object-src 'none'" always;

  # Admin web can reach only its dedicated API.
  location ^~ /v1/platform/admin/ {
    proxy_pass http://master-api:8085;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 8s;
  }
  location ^~ /v1/ { return 404; }
  location ^~ /modules/ { return 404; }
  location = /workspace-runtime.json { return 404; }
  location = /healthz { return 404; }

  location = /master-runtime.json {
    try_files $uri =404;
  }
  location /assets/ {
    try_files $uri =404;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
